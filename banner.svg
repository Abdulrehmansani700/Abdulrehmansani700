<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <radialGradient id="bg" cx="70%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#10163a"/>
      <stop offset="55%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>

    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00AFFF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="300" rx="4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- moving data streak lines -->
    <g stroke="#1c2550" stroke-width="1.4">
      <line x1="0" y1="55" x2="1200" y2="55" opacity="0.5">
        <animate attributeName="opacity" values="0.15;0.55;0.15" dur="3.4s" begin="0s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="95" x2="1200" y2="95" opacity="0.35">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="205" x2="1200" y2="205" opacity="0.4">
        <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.1s" begin="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="245" x2="1200" y2="245" opacity="0.3">
        <animate attributeName="opacity" values="0.45;0.1;0.45" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- traveling light streaks -->
    <g stroke="#00AFFF" stroke-width="2" stroke-linecap="round" opacity="0.55">
      <line x1="-200" y1="60" x2="-40" y2="60">
        <animate attributeName="x1" values="-200;1400" dur="4.5s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-40;1560" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      </line>
      <line x1="-260" y1="240" x2="-80" y2="240">
        <animate attributeName="x1" values="-260;1400" dur="5.2s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-80;1580" dur="5.2s" begin="1.4s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- crosshair reticle -->
    <g transform="translate(870,150)" stroke="#2a3568" stroke-width="1.5" fill="none">
      <circle r="118" opacity="0.8"/>
      <line x1="0" y1="-118" x2="0" y2="-150"/>
      <line x1="0" y1="118" x2="0" y2="150"/>
      <line x1="-118" y1="0" x2="-150" y2="0"/>
      <line x1="118" y1="0" x2="150" y2="0"/>
      <path d="M -160 -110 L -160 -140 L -130 -140" />
      <path d="M 160 -110 L 160 -140 L 130 -140" />
      <path d="M -160 110 L -160 140 L -130 140" />
      <path d="M 160 110 L 160 140 L 130 140" />
    </g>

    <!-- server icon -->
    <g transform="translate(790,150)" fill="none" stroke="#8fd8ff" stroke-width="3" stroke-linejoin="round" filter="url(#glowSoft)">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="2.6s" repeatCount="indefinite"/>
      <rect x="-45" y="-58" width="90" height="34" rx="4"/>
      <circle cx="-27" cy="-41" r="4.5"/>
      <circle cx="-12" cy="-41" r="4.5"/>
      <rect x="-45" y="-18" width="90" height="34" rx="4"/>
      <circle cx="-27" cy="-1" r="4.5"/>
      <circle cx="-12" cy="-1" r="4.5"/>
      <rect x="-45" y="22" width="90" height="34" rx="4"/>
      <circle cx="-27" cy="39" r="4.5"/>
      <circle cx="-12" cy="39" r="4.5"/>
    </g>

    <!-- cloud icon -->
    <g transform="translate(970,130)" fill="none" stroke="#8fd8ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glowSoft)">
      <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2.6s" repeatCount="indefinite"/>
      <path d="M -68 28 a30 30 0 0 1 6 -59 a38 38 0 0 1 72 -8 a26 26 0 0 1 -4 67 z"/>
    </g>

    <!-- connecting arrow with flow animation -->
    <g transform="translate(870,150)">
      <path id="flowPath" d="M -40 25 C -10 55, 40 50, 78 -8" fill="none" stroke="#00F0FF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 10" filter="url(#glowSoft)">
        <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M 78 -8 l -10 -2 l 3 -10 z" fill="#00F0FF" filter="url(#glowSoft)"/>
    </g>

    <!-- Title text -->
    <g filter="url(#glowStrong)">
      <text x="70" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#textGlow)" letter-spacing="2">
        ABDUL REHMAN SANI
        <animate attributeName="opacity" values="0.85;1;0.85" dur="3.2s" repeatCount="indefinite"/>
      </text>
    </g>
    <text x="72" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#c9e8ff" letter-spacing="1.5" opacity="0.9">
      CLOUD DATA ENGINEER
    </text>
    <text x="72" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6f86b8" letter-spacing="0.5">
      Building Scalable Data Pipelines &#183; AWS &#183; Snowflake &#183; Kafka &#183; dbt
    </text>

    <!-- thin accent underline -->
    <rect x="72" y="212" width="230" height="3" fill="url(#textGlow)" opacity="0.8">
      <animate attributeName="width" values="230;260;230" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="298" fill="none" stroke="#1c2550" stroke-width="1"/>
</svg>
